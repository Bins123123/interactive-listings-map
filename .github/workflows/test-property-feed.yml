name: Update property listings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_property_json:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Fetch listings and create properties.json
        run: |
          python3 - <<'PY'
          import json
          import math
          from urllib.parse import parse_qs, urlparse
          from urllib.request import Request, urlopen

          API = (
              "https://buildout.com/plugins/"
              "56d259d694cdeb44b7c2fd4781d039fe754bc021/"
              "inventory.json?page={page}"
          )

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://www.binswanger.com/",
          }

          def fetch_page(page):
              request = Request(API.format(page=page), headers=headers)
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          first_page = fetch_page(0)
          meta = first_page["meta"]
          pages = math.ceil(meta["total"] / meta["limit"])
          properties = []

          for page in range(pages):
              data = first_page if page == 0 else fetch_page(page)

              for listing in data["inventory"]:
                  url = listing["show_link"]
                  property_id = parse_qs(
                      urlparse(url).query
                  ).get("propertyId", [None])[0]

                  if listing.get("sale"):
                      listing_type = "Sale"
                  elif listing.get("sublease"):
                      listing_type = "Sublease"
                  else:
                      listing_type = "Lease"

                  properties.append({
                      "name": listing.get("display_name"),
                      "address": listing.get("address"),
                      "city": listing.get("city"),
                      "state": listing.get("state"),
                      "city_state": listing.get("city_state"),
                      "latitude": listing.get("latitude"),
                      "longitude": listing.get("longitude"),
                      "listing_type": listing_type,
                      "sale": listing.get("sale", False),
                      "sublease": listing.get("sublease", False),
                      "property_type": listing.get("property_sub_type_name"),
                      "size_summary": listing.get("size_summary"),
                      "url": url,
                      "property_id": property_id,
                  })

          with open("properties.json", "w", encoding="utf-8") as output:
              json.dump(properties, output, indent=2, ensure_ascii=False)
              output.write("\n")

          print(f"Created properties.json with {len(properties)} listings.")
          PY

      - name: Validate properties.json
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          properties = json.loads(
              Path("properties.json").read_text(encoding="utf-8")
          )

          if not isinstance(properties, list) or not properties:
              raise SystemExit("Expected a non-empty JSON list")

          for index, item in enumerate(properties):
              if not item.get("name"):
                  raise SystemExit(f"Record {index} is missing a name")

              if urlparse(item.get("url", "")).netloc != "www.binswanger.com":
                  raise SystemExit(f"Record {index} has an invalid URL")

              if not item.get("property_id"):
                  raise SystemExit(f"Record {index} is missing a property ID")

          print(f"Validated {len(properties)} listings.")
          PY

      - name: Commit updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add properties.json

          if git diff --cached --quiet; then
            echo "No listing changes to commit."
          else
            git commit -m "Update property listings"
            git push origin main
          fi
